name: Deploy Firebase Hosting on Push

on:
  push:
    branches:
      - main
      - master

permissions:
  checks: write
  contents: read
  deployments: write

jobs:
  build_and_deploy:
    name: Build & Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Application (vite build)
        run: npm run build

      - name: Deploy to Firebase Hosting Live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccountId: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_YETI_STOCK_SUIVI }}'
          channelId: live
          projectId: yeti-stock-suivi
